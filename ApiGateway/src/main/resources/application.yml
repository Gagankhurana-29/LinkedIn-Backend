spring.application.name: ApiGateway

server.port: 9091

eureka.client.register-with-eureka: true
eureka.client.fetch-registry: true

eureka.client.service-url.defaultZone: http://localhost:8761/eureka/

spring:
  cloud:
    gateway:
      routes:
       - id: user-service
         uri: lb://USER-SERVICE
         predicates:
           - Path=/api/v1/users/**
         filters:
           - StripPrefix=2

       - id: post-service
         uri: lb://POSTS-SERVICE
         predicates:
           - Path=/api/v1/posts/**
         filters:
           - StripPrefix=2


